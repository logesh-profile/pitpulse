services:
  - type: web
    name: pitpulse-backend
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pitpulse-db
          property: connectionString

databases:
  - name: pitpulse-db
    databaseName: pitpulse_db
    plan: free
